<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiBRID Soluciones Energéticas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; }
    /* Scrollbar personalizada para tema oscuro */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // --- CONFIGURACIÓN PRINCIPAL ---
    const API_URL = "https://hibrid-energia.onrender.com"; 
    const WHATSAPP_NUMBER = "569XXXXXXXX"; // <-- ¡CAMBIA ESTO POR TU NÚMERO REAL TIZA!

    // Íconos
    const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
    const IconCart = ({count}) => (
      <div className="relative">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        {count > 0 && <span className="absolute -top-2 -right-2 bg-green-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center">{count}</span>}
      </div>
    );

    // Categorías base para el diseño visual
    const CATEGORIAS_FOTOS = [
      { id: 'paneles', name: 'Paneles Solares', img: 'panelescatalogo.jpg' },
      { id: 'inversores', name: 'Inversores Híbridos', img: 'inversorcatalogo.png' },
      { id: 'baterias', name: 'Baterías de Litio', img: 'bateriacatalogo.jpg' },
      { id: 'aerogeneradores', name: 'Aerogeneradores', img: 'eolica.jpg' },
      { id: 'kits', name: 'Kits Completos', img: 'kitsolar.jpg' },
      { id: 'otros', name: 'Accesorios y Otros', img: 'https://via.placeholder.com/300x200/1e293b/10b981?text=Accesorios' }
    ];

    function App() {
      const [view, setView] = useState('home'); 
      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState([]);
      const [filter, setFilter] = useState('ver todos');
      const [loading, setLoading] = useState(true);

      // Estados Calculadora
      const [calcKWh, setCalcKWh] = useState(15);
      const [calcAutonomia, setCalcAutonomia] = useState(2);

      // Estados Admin
      const [adminToken, setAdminToken] = useState(localStorage.getItem('hibrid_token') || '');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [modal, setModal] = useState({ open: false, product: null });
      const [formData, setFormData] = useState({});

      const fetchProducts = useCallback(async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_URL}/api/products`);
          if (res.ok) setProducts(await res.json());
        } catch (e) {
          console.error("Error al conectar con Render");
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { fetchProducts(); }, [fetchProducts]);

      // Funciones del Carrito
      const addToCart = (p) => {
        setCart([...cart, p]);
        alert(`¡${p.name} agregado al carrito!`);
      };
      
      const cartTotal = cart.reduce((sum, p) => sum + Number(p.price), 0);

      const sendCartToWA = () => {
        let text = `Hola HiBRID, quiero cotizar los siguientes equipos:\n\n`;
        cart.forEach(p => text += `- ${p.name} ($${Number(p.price).toLocaleString('es-CL')})\n`);
        text += `\n*TOTAL ESTIMADO: $${cartTotal.toLocaleString('es-CL')}*`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Funciones Admin
      const loginAdmin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_URL}/api/admin/session`, { headers: { Authorization: `Bearer ${adminToken}` } });
          if (!res.ok) throw new Error();
          setIsAuthenticated(true);
          localStorage.setItem('hibrid_token', adminToken);
          alert("¡Acceso concedido al panel de Tiza!");
        } catch { alert("Contraseña incorrecta. Verifica mayúsculas y espacios."); }
      };

      const saveProduct = async (e) => {
        e.preventDefault();
        const payload = { ...formData, price: Number(formData.price), visible: true };
        const isEditing = !!modal.product;
        const url = `${API_URL}/api/products${isEditing ? `/${modal.product.id}` : ''}`;
        
        try {
          await fetch(url, { 
            method: isEditing ? "PATCH" : "POST", 
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${adminToken}`, ...(isEditing && {"If-Match": modal.product.etag}) }, 
            body: JSON.stringify(payload) 
          });
          setModal({ open: false, product: null });
          fetchProducts();
          alert("Producto guardado con éxito");
        } catch { alert("Error al guardar en el servidor"); }
      };

      const deleteProduct = async (p) => {
        if(!confirm("¿Borrar definitivamente?")) return;
        await fetch(`${API_URL}/api/products/${p.id}`, { method: "DELETE", headers: { Authorization: `Bearer ${adminToken}`, "If-Match": p.etag } });
        fetchProducts();
      };

      return (
        <div className="pb-20">
          {/* HEADER OSCURO */}
          <header className="bg-slate-900 border-b border-slate-700 p-4 sticky top-0 z-40 flex justify-between items-center shadow-lg">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
              <IconSun /> 
              <div>
                <h1 className="font-black text-xl tracking-wider text-white leading-tight">HiBRID</h1>
                <p className="text-[10px] text-green-500 font-bold tracking-widest uppercase">Soluciones Energéticas</p>
              </div>
            </div>
            <nav className="flex space-x-4 items-center">
              <button onClick={() => setView('calculator')} className="text-sm font-medium hover:text-green-400">Calculadora</button>
              <button onClick={() => setView('admin')} className="text-sm font-medium text-slate-400 hover:text-white">Admin</button>
              <button onClick={() => setView('cart')} className="text-green-500 hover:text-green-400">
                <IconCart count={cart.length} />
              </button>
            </nav>
          </header>

          <main className="max-w-5xl mx-auto p-4 py-8">
            
            {/* VISTA 1: INICIO (Categorías con fotos como en tu diseño) */}
            {view === 'home' && (
              <div className="space-y-6">
                <div className="text-center mb-10">
                  <h2 className="text-3xl font-bold text-white mb-2">Encuentra tu equipo ideal</h2>
                  <p className="text-slate-400">Selecciona una categoría para ver nuestro catálogo.</p>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                  {CATEGORIAS_FOTOS.map(cat => (
                    <div key={cat.id} onClick={() => { setFilter(cat.id); setView('catalog'); }} 
                         className="bg-slate-800 rounded-xl overflow-hidden cursor-pointer hover:ring-2 hover:ring-green-500 transition shadow-lg group relative">
                      <img src={cat.img} alt={cat.name} className="w-full h-32 object-cover opacity-70 group-hover:opacity-100 transition" onError={(e)=>e.target.src='https://via.placeholder.com/300x200/1e293b/10b981?text=HiBRID'} />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent flex items-end p-3">
                        <h3 className="font-bold text-white shadow-black drop-shadow-md">{cat.name}</h3>
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={() => { setFilter('ver todos'); setView('catalog'); }} className="w-full mt-6 bg-slate-800 border border-slate-700 py-4 rounded-xl font-bold text-green-400 hover:bg-slate-700 transition">
                  Ver catálogo completo
                </button>
              </div>
            )}

            {/* VISTA 2: CATÁLOGO DE PRODUCTOS (Fondo oscuro, botones verdes) */}
            {view === 'catalog' && (
              <div>
                <div className="flex items-center space-x-4 mb-6">
                  <button onClick={()=>setView('home')} className="text-slate-400 hover:text-white">← Volver</button>
                  <h2 className="text-2xl font-bold uppercase text-green-500">{filter === 'ver todos' ? 'Todos los productos' : filter}</h2>
                </div>

                {loading ? <p className="text-center text-slate-400 py-10">Conectando con el servidor...</p> : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    {products.filter(p => filter === 'ver todos' || p.category === filter).map(p => (
                      <div key={p.id} className="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col">
                        <img src={p.image || 'https://via.placeholder.com/300x200/1e293b/10b981?text=HiBRID'} alt={p.name} className="w-full h-48 object-cover" onError={(e)=>e.target.src='https://via.placeholder.com/300x200/1e293b/10b981?text=HiBRID'} />
                        <div className="p-5 flex flex-col flex-grow">
                          <span className="text-xs text-green-500 font-bold uppercase mb-1">{p.category}</span>
                          <h3 className="font-bold text-lg mb-2 text-white">{p.name}</h3>
                          <p className="text-slate-400 text-sm mb-4 line-clamp-2">{p.description}</p>
                          <div className="mt-auto flex justify-between items-center">
                            <span className="font-black text-xl text-white">${Number(p.price).toLocaleString('es-CL')}</span>
                            <button onClick={() => addToCart(p)} className="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded-lg font-bold text-sm transition">
                              + Carrito
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VISTA 3: CARRITO */}
            {view === 'cart' && (
              <div className="max-w-xl mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h2 className="text-2xl font-bold mb-6 flex items-center space-x-2"><IconCart count={0} /> <span>Tu Cotización</span></h2>
                {cart.length === 0 ? <p className="text-slate-400 text-center py-8">Tu carrito está vacío.</p> : (
                  <div className="space-y-4">
                    {cart.map((p, i) => (
                      <div key={i} className="flex justify-between items-center border-b border-slate-700 pb-2">
                        <div>
                          <p className="font-bold text-white">{p.name}</p>
                          <p className="text-sm text-green-400">${Number(p.price).toLocaleString('es-CL')}</p>
                        </div>
                        <button onClick={() => setCart(cart.filter((_, idx) => idx !== i))} className="text-red-400 text-sm hover:text-red-300">Quitar</button>
                      </div>
                    ))}
                    <div className="pt-4 flex justify-between items-center">
                      <span className="text-lg text-slate-300">Total Estimado:</span>
                      <span className="text-2xl font-black text-white">${cartTotal.toLocaleString('es-CL')}</span>
                    </div>
                    <button onClick={sendCartToWA} className="w-full mt-6 bg-green-600 hover:bg-green-500 text-white font-bold p-4 rounded-xl transition">
                      Enviar Cotización por WhatsApp
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* VISTA 4: CALCULADORA SOLAR (Matemática real y texto legal) */}
            {view === 'calculator' && (
              <div className="max-w-xl mx-auto bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 space-y-6">
                <h2 className="text-2xl font-bold text-white border-b border-slate-700 pb-4">Calculadora Off-Grid / Híbrida</h2>
                
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-bold text-green-400 mb-2">Consumo Diario (kWh/día): {calcKWh}</label>
                    <input type="range" min="2" max="50" value={calcKWh} onChange={e=>setCalcKWh(Number(e.target.value))} className="w-full accent-green-500" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-green-400 mb-2">Días de Autonomía en Baterías: {calcAutonomia}</label>
                    <input type="range" min="1" max="4" value={calcAutonomia} onChange={e=>setCalcAutonomia(Number(e.target.value))} className="w-full accent-green-500" />
                  </div>
                  
                  <div className="bg-slate-900 p-5 rounded-lg border border-slate-700 space-y-3">
                    <h3 className="font-bold text-white border-b border-slate-700 pb-2">Solución Técnica Sugerida:</h3>
                    {/* Matemática Real Off-Grid: Inversor = Consumo / 3 o 4 horas de uso pico. Baterías = Consumo * Autonomía. Paneles = (Consumo / 4h sol) * factor */}
                    <p className="text-sm text-slate-300">⚡ Inversor Sugerido: <strong className="text-white">{Math.ceil(calcKWh / 3.5)} kW</strong></p>
                    <p className="text-sm text-slate-300">🔋 Banco Litio Requerido: <strong className="text-white">{calcKWh * calcAutonomia} kWh</strong></p>
                    <p className="text-sm text-slate-300">☀️ Potencia Paneles: <strong className="text-white">{Math.ceil((calcKWh / 4.5) * 1.2 * 1000)} W</strong></p>
                    <p className="text-xs text-slate-500 mt-4 italic">* Los precios y cálculos son de referencia orientativa y están sujetos a evaluación técnica del terreno.</p>
                  </div>

                  <button onClick={() => {
                    const text = encodeURIComponent(`Hola HiBRID, usé su calculadora web.\nNecesito cotizar un sistema con:\n- Consumo: ${calcKWh} kWh/día\n- Autonomía: ${calcAutonomia} días\n\n*Nota: Entiendo que esto es de referencia y requiere evaluación.*`);
                    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, '_blank');
                  }} className="w-full bg-green-600 text-white font-bold p-4 rounded-xl hover:bg-green-500 transition">
                    Cotizar este Sistema por WhatsApp
                  </button>
                </div>
              </div>
            )}

            {/* VISTA 5: ADMIN RÁPIDO */}
            {view === 'admin' && (
              <div className="max-w-4xl mx-auto">
                {!isAuthenticated ? (
                  <form onSubmit={loginAdmin} className="bg-slate-800 p-6 rounded-xl shadow border border-slate-700 max-w-sm mx-auto">
                    <h2 className="font-bold text-xl text-white mb-4">Acceso Admin</h2>
                    <input type="password" required value={adminToken} onChange={e=>setAdminToken(e.target.value)} placeholder="Tu contraseña exacta de Render" className="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded mb-4 focus:outline-none focus:border-green-500" />
                    <button className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded transition">Ingresar al Panel</button>
                  </form>
                ) : (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <h2 className="text-2xl font-bold text-white">Inventario Activo ({products.length})</h2>
                      <button onClick={() => { setFormData({category:'paneles'}); setModal({open: true, product: null}); }} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">+ Nuevo Producto</button>
                    </div>
                    
                    <div className="bg-slate-800 rounded-xl overflow-hidden border border-slate-700">
                      <table className="w-full text-left text-sm text-slate-300">
                        <thead className="bg-slate-900 border-b border-slate-700 text-green-500">
                          <tr><th className="p-4">Producto</th><th className="p-4">Cat</th><th className="p-4">Precio</th><th className="p-4 text-right">Acciones</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-700">
                          {products.map(p => (
                            <tr key={p.id} className="hover:bg-slate-700/50 transition">
                              <td className="p-4 font-medium text-white flex items-center space-x-3">
                                <img src={p.image || 'https://via.placeholder.com/40'} className="w-10 h-10 rounded object-cover border border-slate-600" onError={(e)=>e.target.style.display='none'} />
                                <span>{p.name}</span>
                              </td>
                              <td className="p-4 uppercase text-xs">{p.category}</td>
                              <td className="p-4 font-bold text-green-400">${Number(p.price).toLocaleString('es-CL')}</td>
                              <td className="p-4 text-right space-x-3">
                                <button onClick={()=>{setFormData({...p}); setModal({open:true, product:p});}} className="text-blue-400 hover:text-blue-300">Editar</button>
                                <button onClick={()=>deleteProduct(p)} className="text-red-400 hover:text-red-300">Borrar</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL EDICIÓN RÁPIDA (Solo sale si haces clic en Editar o Nuevo) */}
          {modal.open && (
            <div className="fixed inset-0 bg-slate-900/90 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveProduct} className="bg-slate-800 p-6 rounded-xl border border-slate-600 max-w-md w-full space-y-4">
                <h3 className="font-bold text-xl text-green-400 mb-2">{modal.product ? 'Editar Rápido' : 'Crear Producto'}</h3>
                
                <input required placeholder="Nombre (Ej: Inversor Deye 5kW)" value={formData.name || ''} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded focus:border-green-500 outline-none" />
                
                <input required type="number" placeholder="Precio en pesos (sin puntos)" value={formData.price || ''} onChange={e=>setFormData({...formData, price: e.target.value})} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded focus:border-green-500 outline-none" />
                
                <select value={formData.category || 'paneles'} onChange={e=>setFormData({...formData, category: e.target.value})} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded focus:border-green-500 outline-none">
                  <option value="paneles">Paneles</option><option value="inversores">Inversores</option><option value="baterias">Baterías</option><option value="aerogeneradores">Aerogeneradores</option><option value="kits">Kits</option><option value="otros">Otros</option>
                </select>
                
                {/* CAMPO DE IMAGEN RÁPIDO */}
                <input placeholder="Nombre de la foto (Ej: panel.jpg)" value={formData.image || ''} onChange={e=>setFormData({...formData, image: e.target.value})} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded focus:border-green-500 outline-none" />
                <p className="text-xs text-slate-400 -mt-2">Pon el nombre exacto del archivo que subiste a GitHub, ej: <span className="text-green-400">eolica.jpg</span></p>

                <textarea placeholder="Descripción técnica breve" value={formData.description || ''} onChange={e=>setFormData({...formData, description: e.target.value})} className="w-full bg-slate-900 border border-slate-600 text-white p-3 rounded focus:border-green-500 outline-none" rows="2"></textarea>
                
                <div className="flex justify-end space-x-3 pt-4 border-t border-slate-700">
                  <button type="button" onClick={()=>setModal({open:false})} className="px-5 py-2 rounded text-slate-300 hover:bg-slate-700">Cancelar</button>
                  <button type="submit" className="px-5 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded">Guardar</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
