<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiBRID Soluciones Energéticas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const API_URL = isLocalhost ? "http://localhost:10000" : "https://hibrid-energia.onrender.com"; 
    const WHATSAPP_NUMBER = "56912345678"; 

    // Íconos SVG
    const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
    const IconSend = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>;
    const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconAlert = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
    const IconCalculator = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;

    function App() {
      const getInitialView = () => {
        if (window.location.hash === '#admin') return 'admin';
        if (window.location.hash === '#calculadora') return 'calculator';
        return 'catalog';
      };

      const [view, setView] = useState(getInitialView());
      const [products, setProducts] = useState([]);
      const [assets, setAssets] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [filter, setFilter] = useState('ver todos');

      // Estados de la Calculadora Solar
      const [calcKWh, setCalcKWh] = useState(10);
      const [calcAutonomia, setCalcAutonomia] = useState(1);

      const [adminToken, setAdminToken] = useState(localStorage.getItem('hibrid_token') || '');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [notification, setNotification] = useState(null);
      const [modal, setModal] = useState({ open: false, product: null });
      const [formData, setFormData] = useState({});

      const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const fetchProducts = useCallback(async () => {
        setLoading(true);
        try {
          const headers = isAuthenticated ? { Authorization: `Bearer ${adminToken}` } : {};
          const res = await fetch(`${API_URL}/api/products`, { headers });
          if (!res.ok) throw new Error();
          setProducts(await res.json());
        } catch {
          setError("Error de conexión. API inactiva o URL incorrecta.");
        } finally {
          setLoading(false);
        }
      }, [isAuthenticated, adminToken]);

      useEffect(() => { fetchProducts(); }, [fetchProducts]);

      const loginAdmin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_URL}/api/admin/session`, { headers: { Authorization: `Bearer ${adminToken}` } });
          if (!res.ok) throw new Error("Token inválido");
          setIsAuthenticated(true);
          localStorage.setItem('hibrid_token', adminToken);
          notify("Acceso concedido");
          fetchProducts();
          fetch(`${API_URL}/api/assets`, { headers: { Authorization: `Bearer ${adminToken}` } })
            .then(r => r.json()).then(setAssets).catch(()=>[]);
        } catch (e) { notify(e.message, "error"); }
      };

      const saveProduct = async (e) => {
        e.preventDefault();
        const payload = { ...formData, price: Number(formData.price), nominalKW: Number(formData.nominalKW), visible: !!formData.visible };
        const isEditing = !!modal.product;
        const url = `${API_URL}/api/products${isEditing ? `/${modal.product.id}` : ''}`;
        const headers = { "Content-Type": "application/json", Authorization: `Bearer ${adminToken}` };
        if (isEditing) headers["If-Match"] = modal.product.etag;

        try {
          const res = await fetch(url, { method: isEditing ? "PATCH" : "POST", headers, body: JSON.stringify(payload) });
          if (res.status === 412) { notify("Conflicto de edición. Refrescando...", "error"); fetchProducts(); setModal({open: false}); return; }
          if (!res.ok) throw new Error();
          notify(isEditing ? "Actualizado" : "Creado");
          setModal({ open: false, product: null });
          fetchProducts();
        } catch { notify("Error al guardar", "error"); }
      };

      const deleteProduct = async (p) => {
        if(!confirm("¿Eliminar definitivamente?")) return;
        try {
          const res = await fetch(`${API_URL}/api/products/${p.id}`, { method: "DELETE", headers: { Authorization: `Bearer ${adminToken}`, "If-Match": p.etag } });
          if (!res.ok && res.status !== 204) throw new Error();
          notify("Eliminado exitosamente"); fetchProducts();
        } catch { notify("Error al eliminar", "error"); }
      };

      const toggleVis = async (p) => {
        try {
          const res = await fetch(`${API_URL}/api/products/${p.id}/visibility`, { method: "PATCH", headers: { "Content-Type": "application/json", Authorization: `Bearer ${adminToken}`, "If-Match": p.etag }, body: JSON.stringify({ visible: !p.visible }) });
          if (!res.ok) throw new Error();
          fetchProducts();
        } catch { notify("Error cambiando visibilidad", "error"); }
      };

      const sendToWA = (name, price) => {
        const text = encodeURIComponent(`Hola HiBRID, me interesa cotizar: "${name}" ($${Number(price).toLocaleString('es-CL')}).`);
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, '_blank');
      };

      const displayedProducts = products.filter(p => filter === 'ver todos' || p.category === filter);

      return (
        <div>
          <header className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
            <div className="flex items-center space-x-2 cursor-pointer" onClick={() => { setView('catalog'); window.location.hash = ''; }}>
              <IconSun /> <span className="font-bold text-lg">HiBRID</span>
            </div>
            <nav className="text-sm font-medium space-x-4">
              <a href="#" onClick={() => { setView('catalog'); setFilter('ver todos'); window.location.hash = ''; }}>Catálogo</a>
              <a href="#calculadora" onClick={() => { setView('calculator'); window.location.hash = 'calculadora'; }}>Calculadora</a>
              <a href="#admin" onClick={() => { setView('admin'); window.location.hash = 'admin'; }}>Admin</a>
            </nav>
          </header>

          {notification && (
            <div className={`fixed top-20 right-4 p-3 rounded shadow text-white flex items-center space-x-2 z-50 ${notification.type === 'error' ? 'bg-red-500' : 'bg-green-500'}`}>
              {notification.type === 'error' ? <IconAlert /> : <IconCheck />}
              <span>{notification.msg}</span>
            </div>
          )}

          <main className="max-w-6xl mx-auto p-4 py-8">
            {view === 'catalog' && (
              <div>
                <h1 className="text-3xl font-bold mb-6 text-slate-800">Catálogo de Productos</h1>
                
                <div className="flex flex-wrap gap-2 mb-8">
                  {['ver todos', 'paneles', 'inversores', 'baterias', 'aerogeneradores', 'kits', 'otros'].map(c => (
                    <button key={c} onClick={() => setFilter(c)} className={`px-4 py-1.5 rounded-full text-sm font-bold uppercase transition ${filter === c ? 'bg-amber-500 text-white' : 'bg-slate-200 text-slate-600 hover:bg-slate-300'}`}>
                      {c}
                    </button>
                  ))}
                </div>

                {loading ? <p className="text-slate-500 text-center py-10">Cargando catálogo...</p> : error ? <p className="text-red-500 text-center py-10">{error}</p> : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    {displayedProducts.map(p => (
                      <div key={p.id} className="bg-white rounded-xl shadow border border-slate-100 overflow-hidden flex flex-col">
                        <img src={p.image || p.image_url || 'https://via.placeholder.com/300x200?text=HiBRID'} alt={p.name} className="h-48 w-full object-cover" onError={(e) => e.target.src='https://via.placeholder.com/300x200?text=HiBRID'} />
                        <div className="p-4 flex flex-col flex-grow">
                          <span className="text-xs text-amber-600 font-bold uppercase mb-1">{p.category}</span>
                          <h3 className="font-bold text-lg mb-2">{p.name}</h3>
                          <p className="text-slate-500 text-sm mb-4 line-clamp-2">{p.description}</p>
                          <div className="mt-auto flex justify-between items-center">
                            <span className="font-black text-xl">${Number(p.price).toLocaleString('es-CL')}</span>
                            <button onClick={() => sendToWA(p.name, p.price)} className="bg-green-600 hover:bg-green-700 text-white p-2 rounded-lg flex items-center space-x-1 text-sm font-bold">
                              <IconSend /> <span>Cotizar</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {view === 'calculator' && (
              <div className="max-w-xl mx-auto bg-white p-6 rounded-xl shadow border space-y-6">
                <div className="flex items-center space-x-2 border-b pb-4">
                  <IconCalculator />
                  <h2 className="text-2xl font-bold text-slate-800">Calculadora Solar HiBRID</h2>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">Consumo Diario Estimado (kWh/día): {calcKWh}</label>
                    <input type="range" min="2" max="50" value={calcKWh} onChange={e=>setCalcKWh(Number(e.target.value))} className="w-full accent-amber-500" />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-1">Días de Autonomía (Respaldo sin sol): {calcAutonomia}</label>
                    <input type="range" min="1" max="3" value={calcAutonomia} onChange={e=>setCalcAutonomia(Number(e.target.value))} className="w-full accent-amber-500" />
                  </div>
                  <div className="bg-slate-50 p-4 rounded-lg border space-y-2">
                    <h3 className="font-bold text-slate-700">Recomendación Sugerida:</h3>
                    <p className="text-sm text-slate-600">⚡ Inversor Híbrido recomendado: <strong>{Math.ceil(calcKWh / 4)} kW</strong></p>
                    <p className="text-sm text-slate-600">🔋 Banco de Baterías Litio sugerido: <strong>{calcKWh * calcAutonomia} kWh</strong></p>
                    <p className="text-sm text-slate-600">☀️ Potencia de Paneles solares: <strong>{calcKWh * 350} W</strong></p>
                  </div>
                  <button onClick={() => {
                    const text = encodeURIComponent(`Hola HiBRID, usé la calculadora web y necesito cotizar un sistema para ${calcKWh} kWh/día con ${calcAutonomia} días de autonomía.`);
                    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`, '_blank');
                  }} className="w-full bg-green-600 text-white font-bold p-3 rounded-lg flex items-center justify-center space-x-2 hover:bg-green-700">
                    <IconSend /> <span>Cotizar este Sistema por WhatsApp</span>
                  </button>
                </div>
              </div>
            )}

            {view === 'admin' && (
              <div>
                {!isAuthenticated ? (
                  <form onSubmit={loginAdmin} className="max-w-md mx-auto bg-white p-6 rounded-xl shadow space-y-4 border mt-10">
                    <h2 className="font-bold text-xl">Acceso Admin</h2>
                    <input type="password" required value={adminToken} onChange={e=>setAdminToken(e.target.value)} placeholder="ADMIN_TOKEN" className="w-full border p-2 rounded" />
                    <button className="w-full bg-slate-900 text-white font-bold p-2 rounded">Ingresar</button>
                  </form>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center bg-white p-4 rounded shadow border">
                      <h2 className="font-bold text-xl">Inventario ({products.length})</h2>
                      <button onClick={() => { setFormData({name:'', price:'', description:'', category:'kits', visible:true, nominalKW:0}); setModal({open: true, product: null}); }} className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">Nuevo Producto</button>
                    </div>
                    
                    <div className="bg-white rounded shadow overflow-x-auto border">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b text-slate-500">
                          <tr><th className="p-3">Producto</th><th className="p-3">Cat</th><th className="p-3">Precio</th><th className="p-3">Est</th><th className="p-3 text-right">Acciones</th></tr>
                        </thead>
                        <tbody className="divide-y">
                          {products.map(p => (
                            <tr key={p.id}>
                              <td className="p-3 font-semibold">{p.name}</td>
                              <td className="p-3 uppercase text-xs">{p.category}</td>
                              <td className="p-3">${Number(p.price).toLocaleString()}</td>
                              <td className="p-3"><button onClick={()=>toggleVis(p)} className={`px-2 py-1 rounded text-xs text-white ${p.visible ? 'bg-green-500':'bg-slate-400'}`}>{p.visible ? 'Visible':'Oculto'}</button></td>
                              <td className="p-3 text-right space-x-2">
                                <button onClick={()=>{setFormData({...p}); setModal({open:true, product:p});}} className="text-blue-500 underline">Editar</button>
                                <button onClick={()=>deleteProduct(p)} className="text-red-500 underline">Borrar</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* Admin Modal */}
          {modal.open && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveProduct} className="bg-white p-6 rounded-xl shadow-xl max-w-lg w-full space-y-4">
                <h3 className="font-bold text-lg">{modal.product ? 'Editar Producto' : 'Nuevo Producto'}</h3>
                <input required placeholder="Nombre del equipo" value={formData.name || ''} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full border p-2 rounded" />
                <div className="flex gap-2">
                  <input required type="number" placeholder="Precio ($)" value={formData.price || ''} onChange={e=>setFormData({...formData, price: e.target.value})} className="w-1/2 border p-2 rounded" />
                  <input type="number" step="0.1" placeholder="Potencia kW (Opcional)" value={formData.nominalKW || ''} onChange={e=>setFormData({...formData, nominalKW: e.target.value})} className="w-1/2 border p-2 rounded" />
                </div>
                <select value={formData.category || 'kits'} onChange={e=>setFormData({...formData, category: e.target.value})} className="w-full border p-2 rounded">
                  <option value="paneles">Paneles</option><option value="inversores">Inversores</option><option value="baterias">Baterías</option><option value="aerogeneradores">Aerogeneradores</option><option value="kits">Kits</option><option value="otros">Otros</option>
                </select>
                <div className="flex gap-2">
                  <select onChange={e=>setFormData({...formData, image: e.target.value})} className="w-1/2 border p-2 rounded">
                    <option value="">Selecciona imagen base</option>
                    {assets.map(a => <option key={a.value} value={a.value}>{a.label}</option>)}
                  </select>
                  <input placeholder="O URL externa" value={formData.image || formData.image_url || ''} onChange={e=>setFormData({...formData, image: e.target.value})} className="w-1/2 border p-2 rounded" />
                </div>
                <textarea required placeholder="Descripción técnica" value={formData.description || ''} onChange={e=>setFormData({...formData, description: e.target.value})} className="w-full border p-2 rounded" rows="3"></textarea>
                <label className="flex items-center space-x-2">
                  <input type="checkbox" checked={formData.visible ?? true} onChange={e=>setFormData({...formData, visible: e.target.checked})} /> 
                  <span>Visible públicamente</span>
                </label>
                <div className="flex justify-end space-x-2 pt-2">
                  <button type="button" onClick={()=>setModal({open:false})} className="px-4 py-2 border rounded text-slate-600">Cancelar</button>
                  <button type="submit" className="px-4 py-2 bg-amber-500 text-white font-bold rounded">Guardar Cambios</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
