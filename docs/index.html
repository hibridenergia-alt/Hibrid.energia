<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HiBRID | Energía, Construcción y Arriendo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #000000; color: #f8fafc; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-anim { animation: slideInUp 0.3s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const API_URL = "https://hibrid-energia.onrender.com";
    const WHATSAPP_NUMBER = "56956139055";

    // ============================================================
    // Metadatos fijos por pilar (nombre + a qué pilares pertenece la categoría).
    // "electricidad" aparece en Energía y Construcción a la vez, apuntando a la
    // misma cotización, tal como se definió.
    // ============================================================
    const CATEGORIA_META = {
      energia: [
        { id: 'paneles', name: 'Paneles Solares' },
        { id: 'inversores', name: 'Inversores Híbridos' },
        { id: 'baterias', name: 'Baterías de Litio' },
        { id: 'aerogeneradores', name: 'Aerogeneradores' },
        { id: 'kits', name: 'Kits Solares Completos' },
        { id: 'electricidad', name: 'Instalaciones y Proyectos Eléctricos' },
        { id: 'otros', name: 'Accesorios y Otros' }
      ],
      construccion: [
        { id: 'soldadura', name: 'Soldadura y Maestranza' },
        { id: 'carpinteria', name: 'Carpintería y Techumbre' },
        { id: 'gasfiteria', name: 'Gasfitería' },
        { id: 'obras-civiles', name: 'Obras Civiles' },
        { id: 'electricidad', name: 'Instalaciones y Proyectos Eléctricos' }
      ],
      arriendo: [
        { id: 'herramientas', name: 'Arriendo de Herramientas' },
        { id: 'maquinaria', name: 'Arriendo de Maquinaria' },
        { id: 'movimiento-tierra', name: 'Movimiento de Tierra' },
        { id: 'mantencion-maquinaria', name: 'Mantención de Maquinaria' }
      ]
    };

    const PILLAR_INFO = {
      energia: { label: 'Energía', title: 'Soluciones de Energía Solar', subtitle: 'Selecciona una categoría para ver nuestro catálogo.' },
      construccion: { label: 'Construcción', title: 'Servicios de Construcción', subtitle: 'Trabajos realizados — cotiza tu proyecto por WhatsApp.' },
      arriendo: { label: 'Arriendo', title: 'Arriendo de Maquinaria y Herramientas', subtitle: 'Equipos disponibles para tu faena.' }
    };

    // Colores fijos: literales completos (no interpolados) para que Tailwind los reconozca siempre.
    function accentClasses(pillar) {
      if (pillar === 'construccion') return { text: 'text-red-500', bg: 'bg-red-600', bgHover: 'hover:bg-red-500', ring: 'hover:ring-red-500' };
      if (pillar === 'arriendo') return { text: 'text-blue-500', bg: 'bg-blue-600', bgHover: 'hover:bg-blue-500', ring: 'hover:ring-blue-500' };
      return { text: 'text-green-500', bg: 'bg-green-600', bgHover: 'hover:bg-green-500', ring: 'hover:ring-green-500' };
    }
    function grayClasses(pillar) {
      if (pillar === 'construccion') return { card: 'bg-stone-800', border: 'border-stone-700', muted: 'text-stone-400' };
      if (pillar === 'arriendo') return { card: 'bg-zinc-800', border: 'border-zinc-700', muted: 'text-zinc-400' };
      return { card: 'bg-slate-800', border: 'border-slate-700', muted: 'text-slate-400' };
    }

    const IconCart = ({count}) => (
      <div className="relative">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        {count > 0 && <span className="absolute -top-2 -right-2 bg-green-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center shadow-md">{count}</span>}
      </div>
    );
    const IconGear = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const IconFB = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>;
    const IconIG = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>;
    const IconTikTok = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5v3a8 8 0 0 1-5-1.5z"/></svg>;

    function RefreshButton({ onClick, label = "Actualizar lista" }) {
      return (
        <button type="button" onClick={onClick} className="text-xs bg-slate-700 hover:bg-slate-600 text-green-400 px-3 py-1 rounded-full transition">
          🔄 {label}
        </button>
      );
    }

    function normalizeUrl(url) {
      if (!url) return '';
      const trimmed = url.trim();
      if (!trimmed) return '';
      return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    }

    function App() {
      // view: 'home' | 'catalog' | 'cart' | 'admin'
      // pillar: 'energia' | 'construccion' | 'arriendo' (solo aplica a home/catalog)
      const [view, setView] = useState('home');
      const [pillar, setPillar] = useState('energia');
      const [pillarTab, setPillarTab] = useState('catalogo'); // 'catalogo' | 'cotizador'
      const [services, setServices] = useState([]);
      const [cotizadorQty, setCotizadorQty] = useState({}); // { serviceId: cantidad }
      const [calcKWh, setCalcKWh] = useState(15);
      const [calcAutonomia, setCalcAutonomia] = useState(2);
      const [adminTab, setAdminTab] = useState('inventario');
      const [products, setProducts] = useState([]);
      const [cart, setCart] = useState([]);
      const [filter, setFilter] = useState('ver todos');
      const [loading, setLoading] = useState(true);
      const [toastMsg, setToastMsg] = useState(null);

      const toastTimer = useRef(null);
      const showToast = useCallback((msg) => {
        if (toastTimer.current) clearTimeout(toastTimer.current);
        setToastMsg(msg);
        toastTimer.current = setTimeout(() => setToastMsg(null), 3000);
      }, []);

      const [adminToken, setAdminToken] = useState(localStorage.getItem('hibrid_token') || '');
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [modal, setModal] = useState({ open: false, product: null });
      const [formData, setFormData] = useState({});
      const [serviceModal, setServiceModal] = useState({ open: false, service: null });
      const [serviceFormData, setServiceFormData] = useState({});

      const [pillarImageOptions, setPillarImageOptions] = useState([]);
      const [bannerAssets, setBannerAssets] = useState([]);
      const [mensajeAssets, setMensajeAssets] = useState([]);
      const [categoriaAssetsEnergia, setCategoriaAssetsEnergia] = useState([]);
      const [categoriaAssetsConstruccion, setCategoriaAssetsConstruccion] = useState([]);
      const [categoriaAssetsArriendo, setCategoriaAssetsArriendo] = useState([]);
      const [assetErrors, setAssetErrors] = useState({});

      const [config, setConfig] = useState(null);
      const [configForm, setConfigForm] = useState(null);
      const [bannerIndex, setBannerIndex] = useState(0);
      const [showPromo, setShowPromo] = useState(true);

      // ============================================================
      // Navegación con historial real del navegador (arregla el botón Atrás)
      // ============================================================
      const navigate = useCallback((newView, extra = {}) => {
        setView(newView);
        if (extra.pillar !== undefined) setPillar(extra.pillar);
        if (extra.filter !== undefined) setFilter(extra.filter);
        window.history.pushState({ view: newView, pillar: extra.pillar ?? pillar, filter: extra.filter ?? filter }, '', '#' + newView);
      }, [pillar, filter]);

      useEffect(() => {
        window.history.replaceState({ view: 'home', pillar: 'energia', filter: 'ver todos' }, '', '#home');
        const handlePopState = (e) => {
          const state = e.state || { view: 'home', pillar: 'energia', filter: 'ver todos' };
          setView(state.view);
          if (state.pillar) setPillar(state.pillar);
          if (state.filter) setFilter(state.filter);
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      const goPillar = (p) => { setPillarTab('catalogo'); navigate('home', { pillar: p, filter: 'ver todos' }); };
      const goCategory = (p, catId) => navigate('catalog', { pillar: p, filter: catId });

      const fetchProducts = useCallback(async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_URL}/api/products`);
          if (res.ok) setProducts(await res.json());
        } catch (e) { console.error("Error al conectar con el servidor."); }
        finally { setLoading(false); }
      }, []);

      const fetchConfig = useCallback(async () => {
        try {
          const res = await fetch(`${API_URL}/api/config`);
          if (res.ok) setConfig(await res.json());
        } catch (e) { console.error("Error cargando configuración"); }
      }, []);

      const fetchServices = useCallback(async () => {
        try {
          const res = await fetch(`${API_URL}/api/services`);
          if (res.ok) setServices(await res.json());
        } catch (e) { console.error("Error cargando servicios"); }
      }, []);

      useEffect(() => { fetchServices(); }, [fetchServices]);

      function unitLabel(unit) {
        return { m2: 'm²', m3: 'm³', punto: 'puntos', dia: 'días', servicio: 'servicio' }[unit] || unit;
      }

      function calcularServicio(s, cantidad) {
        const q = Number(cantidad) || 0;
        if (!s.formula) return { total: (s.precioRef || 0) * q };
        const costoDirecto = (Number(s.materiales || 0) + Number(s.manoObra || 0) + Number(s.equipo || 0)) * q;
        const conGG = costoDirecto * (1 + (s.gg || 0) / 100);
        const neto = conGG * (1 + (s.utilidad || 0) / 100);
        const final = neto * (1 + (s.iva || 0) / 100);
        return { total: final };
      }

      useEffect(() => { fetchProducts(); }, [fetchProducts]);
      useEffect(() => { fetchConfig(); }, [fetchConfig]);
      useEffect(() => { if (config && !configForm) setConfigForm(config); }, [config, configForm]);

      useEffect(() => {
        if (!config || config.banner.mode !== 'rotating' || config.banner.images.length <= 1) return;
        const interval = setInterval(() => setBannerIndex(prev => (prev + 1) % config.banner.images.length), 5000);
        return () => clearInterval(interval);
      }, [config]);

      const fetchFolderAssets = async (folder, setter, forceRefresh = false) => {
        try {
          const url = `${API_URL}/api/assets/${folder}${forceRefresh ? '?refresh=true' : ''}`;
          const res = await fetch(url, { headers: { Authorization: `Bearer ${adminToken}` } });
          const data = await res.json();
          if (!res.ok) {
            setAssetErrors(prev => ({...prev, [folder]: data.error || `Error HTTP ${res.status}`}));
            return;
          }
          setAssetErrors(prev => ({...prev, [folder]: null}));
          setter(data);
        } catch (e) {
          setAssetErrors(prev => ({...prev, [folder]: 'No se pudo conectar con el servidor'}));
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchFolderAssets('banner', setBannerAssets);
          fetchFolderAssets('mensajes', setMensajeAssets);
          fetchFolderAssets('categorias-energia', setCategoriaAssetsEnergia);
          fetchFolderAssets('categorias-construccion', setCategoriaAssetsConstruccion);
          fetchFolderAssets('categorias-arriendo', setCategoriaAssetsArriendo);
        }
      }, [isAuthenticated]);

      // Cuando se abre el modal de producto o cambia el pilar elegido, recarga sus fotos
      useEffect(() => {
        if (modal.open && formData.pillar) {
          fetchFolderAssets(`productos-${formData.pillar}`, setPillarImageOptions);
        }
      }, [modal.open, formData.pillar]);

      const addToCart = (p) => {
        setCart([...cart, p]);
        showToast(`✅ ${p.name} agregado`);
      };

      const cartTotal = cart.reduce((sum, p) => sum + Number(p.price), 0);

      const sendCartToWA = () => {
        let text = `Hola HiBRID, quiero cotizar los siguientes equipos/servicios:\n\n`;
        cart.forEach(p => text += `- ${p.name} ($${Number(p.price).toLocaleString('es-CL')})\n`);
        text += `\n*TOTAL ESTIMADO: $${cartTotal.toLocaleString('es-CL')}*`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const sendSingleQuote = (p) => {
        const text = `Hola HiBRID, quiero cotizar:\n\n- ${p.name} ($${Number(p.price).toLocaleString('es-CL')})`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
      };

      // ============================================================
      // Cotizador: agregar servicio al carrito / cotizar directo
      // ============================================================
      const serviceAsCartItem = (s, cantidad, total, extraLabel) => ({
        id: `${s.id}-${Date.now()}`,
        name: extraLabel || `${s.name} (${cantidad} ${unitLabel(s.unit)})`,
        price: Math.round(total)
      });

      const addServiceToCart = (s, cantidad) => {
        const { total } = calcularServicio(s, cantidad);
        addToCart(serviceAsCartItem(s, cantidad, total));
      };

      const sendServiceQuote = (s, cantidad) => {
        const { total } = calcularServicio(s, cantidad);
        let text = `Hola HiBRID, quiero cotizar:\n\n- ${s.name}: ${cantidad} ${unitLabel(s.unit)} (estimado $${Math.round(total).toLocaleString('es-CL')})`;
        if (s.notaSec) text += `\n\n*Instalaciones nuevas requieren instalador certificado SEC.`;
        text += `\n\n*Precio referencial, sujeto a evaluación técnica.`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Sistema Solar (Energía) — recomendación a partir de consumo real
      const solarPanel = products.find(p => p.id === 'seed-panel-550w') || { price: 150000, name: 'Panel Solar 550W' };
      const solarInversor = products.find(p => p.id === 'seed-inversor-5kw') || { price: 850000, name: 'Inversor Híbrido 5kW' };
      const solarBateria = products.find(p => p.id === 'seed-bateria-4-8kwh') || { price: 1250000, name: 'Batería Litio 4.8kWh' };

      const kwInversor = Math.ceil(calcKWh / 3.5);
      const wPaneles = Math.ceil((calcKWh / 4.5) * 1.2 * 1000);
      const cantPaneles = Math.max(1, Math.ceil(wPaneles / 550));
      const cantBaterias = Math.max(1, Math.ceil((calcKWh * calcAutonomia) / 4.8));
      const cantInversores = Math.max(1, Math.ceil(kwInversor / 5));
      const materialesSolar = cantPaneles * solarPanel.price + cantInversores * solarInversor.price + cantBaterias * solarBateria.price;
      const instalacionPct = config?.energiaInstalacionPct ?? 15;
      const instalacionSolar = materialesSolar * (instalacionPct / 100);
      const totalSolar = materialesSolar + instalacionSolar;

      const addSolarToCart = () => {
        addToCart(serviceAsCartItem({ id: 'srv-sistema-solar', unit: 'servicio' }, 1, totalSolar,
          `Sistema Solar (${cantPaneles}x Panel, ${cantInversores}x Inversor, ${cantBaterias}x Batería)`));
      };
      const sendSolarQuote = () => {
        const text = `Hola HiBRID, quiero cotizar un Sistema Solar:\n\n` +
          `- Consumo: ${calcKWh} kWh/día, Autonomía: ${calcAutonomia} días\n` +
          `- Recomendado: ${cantPaneles}x Panel 550W, ${cantInversores}x Inversor, ${cantBaterias}x Batería 4.8kWh\n` +
          `- Materiales: $${Math.round(materialesSolar).toLocaleString('es-CL')}\n` +
          `- Instalación (${instalacionPct}%): $${Math.round(instalacionSolar).toLocaleString('es-CL')}\n` +
          `*TOTAL ESTIMADO: $${Math.round(totalSolar).toLocaleString('es-CL')}*\n\n` +
          `*Precio referencial, sujeto a evaluación técnica del terreno.`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
      };

      const loginAdmin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_URL}/api/admin/session`, { headers: { Authorization: `Bearer ${adminToken}` } });
          if (!res.ok) throw new Error();
          setIsAuthenticated(true);
          localStorage.setItem('hibrid_token', adminToken);
          showToast("✅ Acceso Admin Concedido");
        } catch { alert("Contraseña incorrecta."); }
      };

      const logoutAdmin = () => {
        setIsAuthenticated(false);
        setAdminToken('');
        localStorage.removeItem('hibrid_token');
        showToast("👋 Sesión cerrada");
      };

      const saveProduct = async (e) => {
        e.preventDefault();
        const isEditing = !!modal.product;
        const payload = { ...formData, price: Number(formData.price), visible: isEditing ? (formData.visible ?? modal.product.visible) : true };
        const url = `${API_URL}/api/products${isEditing ? `/${modal.product.id}` : ''}`;
        try {
          const res = await fetch(url, {
            method: isEditing ? "PATCH" : "POST",
            headers: { "Content-Type": "application/json", Authorization: `Bearer ${adminToken}`, ...(isEditing && {"If-Match": modal.product.etag}) },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error("Conflicto al guardar.");
          setModal({ open: false, product: null });
          fetchProducts();
          showToast("✅ Producto guardado");
        } catch (e) { alert("Error al guardar: " + e.message); }
      };

      const deleteProduct = async (p) => {
        if (!confirm(`¿Borrar definitivamente ${p.name}?`)) return;
        try {
          const res = await fetch(`${API_URL}/api/products/${p.id}`, { method: "DELETE", headers: { Authorization: `Bearer ${adminToken}`, "If-Match": p.etag } });
          if (!res.ok) throw new Error("No se pudo borrar");
          fetchProducts();
          showToast("🗑️ Producto borrado");
        } catch (e) { alert(e.message); }
      };

      const saveConfig = async () => {
        try {
          const cleanSocial = configForm.social ? {
            facebook: normalizeUrl(configForm.social.facebook),
            instagram: normalizeUrl(configForm.social.instagram),
            tiktok: normalizeUrl(configForm.social.tiktok)
          } : configForm.social;
          const cleanFerreteria = configForm.ferreteria ? { ...configForm.ferreteria, url: normalizeUrl(configForm.ferreteria.url) } : configForm.ferreteria;
          const res = await fetch(`${API_URL}/api/config`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}`, 'If-Match': config.etag },
            body: JSON.stringify({ banner: configForm.banner, promo: configForm.promo, categorias: configForm.categorias, ferreteria: cleanFerreteria, social: cleanSocial, energiaInstalacionPct: configForm.energiaInstalacionPct })
          });
          if (!res.ok) throw new Error('No se pudo guardar.');
          const updated = await res.json();
          setConfig(updated);
          setConfigForm(updated);
          showToast('✅ Configuración guardada');
        } catch (e) { alert(e.message); }
      };

      const saveService = async (e) => {
        e.preventDefault();
        try {
          const payload = { ...serviceFormData };
          ['materiales','manoObra','equipo','gg','utilidad','iva','precioRef'].forEach(k => {
            if (payload[k] !== undefined && payload[k] !== '') payload[k] = Number(payload[k]);
          });
          const res = await fetch(`${API_URL}/api/services/${serviceModal.service.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${adminToken}`, 'If-Match': serviceModal.service.etag },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error('No se pudo guardar el servicio.');
          setServiceModal({ open: false, service: null });
          fetchServices();
          showToast('✅ Servicio actualizado');
        } catch (e) { alert(e.message); }
      };

      const theme = { ...accentClasses(pillar), ...grayClasses(pillar) };
      const info = PILLAR_INFO[pillar];

      return (
        <div className="min-h-screen flex flex-col pb-24 bg-black">

          {/* BARRA SUPERIOR: FERRETERÍA ONLINE */}
          {config && config.ferreteria?.enabled && config.ferreteria?.url && (
            <div className="bg-black border-b border-slate-800 py-1.5 px-4 text-xs flex justify-center md:justify-end items-center text-slate-400">
              <a href={normalizeUrl(config.ferreteria.url)} target="_blank" rel="noopener noreferrer" className="text-green-400 hover:underline font-bold">
                {config.ferreteria.label || 'Ir a Ferretería Online →'}
              </a>

                                <div key={cat.id} className="space-y-2">
                                  <p className="text-sm font-bold text-green-400">{cat.name}</p>
                                  <div className="grid grid-cols-4 gap-2 max-h-32 overflow-y-auto p-2 bg-black rounded-lg">
                                    {assets.map(path => (
                                      <div key={path} onClick={() => setConfigForm({...configForm, categorias: {...configForm.categorias, [cat.id]: path}})}
                                        className={`relative rounded-lg overflow-hidden cursor-pointer border-2 ${configForm.categorias[cat.id] === path ? 'border-green-500' : 'border-transparent'}`}>
                                        <img src={path} className="w-full h-14 object-cover" onError={(e)=>e.target.src='https://via.placeholder.com/60?text=?'} />
                                      </div>
                                    ))}
                                  </div>
                                  {assetErrors[errKey] && <p className="text-red-400 text-xs">⚠️ {assetErrors[errKey]}</p>}
                                  {!assetErrors[errKey] && assets.length === 0 && <p className="text-slate-500 text-xs">No hay fotos en docs/{pil === 'energia' ? 'categoria' : pil + '/categorias'}/.</p>}
                                </div>
                              ))}
                            </div>
                          );
                        })}

                        {/* FERRETERÍA */}
                        <div className="bg-slate-900 p-6 rounded-xl border border-slate-700 space-y-4">
                          <h3 className="text-xl font-bold text-white">🛒 Ferretería Online (link satélite)</h3>
                          <label className="flex items-center gap-2 text-sm text-slate-300">
                            <input type="checkbox" checked={configForm.ferreteria?.enabled || false} onChange={e=>setConfigForm({...configForm, ferreteria: {...(configForm.ferreteria||{}), enabled: e.target.checked}})} /> Mostrar barra de enlace a la Ferretería
                          </label>
                          {configForm.ferreteria?.enabled && (
                            <>
                              <input placeholder="URL de la ferretería (https://...)" value={configForm.ferreteria?.url || ''} onChange={e=>setConfigForm({...configForm, ferreteria: {...(configForm.ferreteria||{}), url: e.target.value}})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                              <input placeholder="Texto del enlace" value={configForm.ferreteria?.label || ''} onChange={e=>setConfigForm({...configForm, ferreteria: {...(configForm.ferreteria||{}), label: e.target.value}})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                            </>
                          )}
                        </div>

                        {/* REDES SOCIALES */}
                        <div className="bg-slate-900 p-6 rounded-xl border border-slate-700 space-y-3">
                          <h3 className="text-xl font-bold text-white">📱 Redes Sociales</h3>
                          <p className="text-xs text-slate-500">Deja el campo vacío para ocultar ese ícono del pie de página.</p>
                          <input placeholder="Link de Facebook" value={configForm.social?.facebook || ''} onChange={e=>setConfigForm({...configForm, social: {...(configForm.social||{}), facebook: e.target.value}})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                          <input placeholder="Link de Instagram" value={configForm.social?.instagram || ''} onChange={e=>setConfigForm({...configForm, social: {...(configForm.social||{}), instagram: e.target.value}})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                          <input placeholder="Link de TikTok" value={configForm.social?.tiktok || ''} onChange={e=>setConfigForm({...configForm, social: {...(configForm.social||{}), tiktok: e.target.value}})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                        </div>

                        {/* % INSTALACIÓN SISTEMA SOLAR */}
                        <div className="bg-slate-900 p-6 rounded-xl border border-slate-700 space-y-2">
                          <h3 className="text-xl font-bold text-white">☀️ % Instalación Sistema Solar</h3>
                          <p className="text-xs text-slate-500">Porcentaje que se suma sobre el valor de los equipos en el Cotizador de Energía.</p>
                          <input type="number" min="0" value={configForm.energiaInstalacionPct ?? 15} onChange={e=>setConfigForm({...configForm, energiaInstalacionPct: Number(e.target.value)})} className="w-24 bg-black border border-slate-600 text-white p-2 rounded" />
                          <span className="text-slate-400 ml-1">%</span>
                        </div>

                        <button onClick={saveConfig} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition">Guardar Configuración de Portada</button>
                      </div>
                    )}

                    {adminTab === 'servicios' && (
                      <div className="space-y-6">
                        <h2 className="text-2xl font-bold text-white">Servicios del Cotizador ({services.length})</h2>
                        {['energia','construccion','arriendo'].map(pil => (
                          <div key={pil} className="space-y-2">
                            <h3 className={`font-bold ${accentClasses(pil).text}`}>{PILLAR_INFO[pil].label}</h3>
                            <div className="bg-slate-900 rounded-xl border border-slate-700 divide-y divide-slate-700">
                              {services.filter(s => s.pillar === pil).map(s => (
                                <div key={s.id} className="p-4 flex items-center justify-between gap-3">
                                  <div>
                                    <p className="text-white font-medium">{s.name}</p>
                                    <p className="text-xs text-slate-400">
                                      {s.formula ? `Materiales $${s.materiales} + M.Obra $${s.manoObra} + Equipo $${s.equipo} · GG ${s.gg}% · Util ${s.utilidad}% · IVA ${s.iva}%` : `Precio referencial: $${Number(s.precioRef).toLocaleString('es-CL')} por ${unitLabel(s.unit)}`}
                                    </p>
                                  </div>
                                  <button onClick={() => { setServiceFormData({...s}); setServiceModal({open:true, service:s}); }} className="text-blue-400 hover:text-blue-300 text-sm flex-shrink-0">Editar</button>
                                </div>
                              ))}
                              {services.filter(s => s.pillar === pil).length === 0 && <p className="p-4 text-slate-500 text-sm">Sin servicios cargados.</p>}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>

          <footer className="mt-auto bg-black border-t border-slate-800 p-6">
            <div className="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center text-slate-400 text-sm">
              <p>© 2026 HiBRID. Todos los derechos reservados.</p>
              <div className="flex space-x-6 mt-4 md:mt-0">
                {config?.social?.facebook && <a href={normalizeUrl(config.social.facebook)} target="_blank" rel="noopener noreferrer" className="hover:text-green-500 transition"><IconFB /></a>}
                {config?.social?.instagram && <a href={normalizeUrl(config.social.instagram)} target="_blank" rel="noopener noreferrer" className="hover:text-green-500 transition"><IconIG /></a>}
                {config?.social?.tiktok && <a href={normalizeUrl(config.social.tiktok)} target="_blank" rel="noopener noreferrer" className="hover:text-green-500 transition"><IconTikTok /></a>}
              </div>
            </div>
          </footer>

          {/* MENSAJE DE BIENVENIDA / OFERTA */}
          {config && config.promo.enabled && showPromo && (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-3 z-[60]">
              <div className="bg-slate-900 rounded-2xl border border-slate-700 w-full max-w-md overflow-hidden shadow-2xl relative max-h-[92vh] flex flex-col">
                <button onClick={() => setShowPromo(false)} className="absolute top-3 right-3 text-slate-200 hover:text-white bg-black/70 rounded-full w-9 h-9 flex items-center justify-center z-10 text-lg">✕</button>
                <img src={config.promo.image} alt={config.promo.title || 'HiBRID'} className={`w-full object-cover ${config.promo.mode === 'imagen' ? 'h-[85vh]' : 'h-[60vh]'}`} onError={(e)=>{ e.target.src='https://via.placeholder.com/400x600/1e293b/10b981?text=HiBRID'; }} />
                {config.promo.mode !== 'imagen' && (
                  <div className="p-6 text-center space-y-3 overflow-y-auto">
                    <h3 className="text-xl font-black text-white">{config.promo.title}</h3>
                    <p className="text-slate-400 text-sm">{config.promo.text}</p>
                    <button onClick={() => { goCategory(pillar, 'ver todos'); setShowPromo(false); }} className="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-xl transition">
                      {config.promo.ctaLabel || 'Ver Catálogo'}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-full shadow-2xl font-bold z-50 flex items-center space-x-2 toast-anim">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* MODAL DE SERVICIO (Cotizador) */}
          {serviceModal.open && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveService} className="bg-slate-900 p-6 rounded-xl border border-slate-600 max-w-md w-full space-y-4 max-h-[92vh] overflow-y-auto">
                <h3 className="font-bold text-xl text-green-400 mb-2">Editar Precios — {serviceModal.service?.name}</h3>

                {serviceFormData.formula ? (
                  <>
                    <label className="text-xs text-slate-400 block">Materiales (por {unitLabel(serviceFormData.unit)})</label>
                    <input type="number" min="0" value={serviceFormData.materiales ?? 0} onChange={e=>setServiceFormData({...serviceFormData, materiales: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                    <label className="text-xs text-slate-400 block">Mano de Obra (por {unitLabel(serviceFormData.unit)})</label>
                    <input type="number" min="0" value={serviceFormData.manoObra ?? 0} onChange={e=>setServiceFormData({...serviceFormData, manoObra: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                    <label className="text-xs text-slate-400 block">Equipo/Traslado (por {unitLabel(serviceFormData.unit)})</label>
                    <input type="number" min="0" value={serviceFormData.equipo ?? 0} onChange={e=>setServiceFormData({...serviceFormData, equipo: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                    <div className="grid grid-cols-3 gap-2">
                      <div>
                        <label className="text-xs text-slate-400 block">% Gastos Grales.</label>
                        <input type="number" min="0" value={serviceFormData.gg ?? 20} onChange={e=>setServiceFormData({...serviceFormData, gg: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block">% Utilidad</label>
                        <input type="number" min="0" value={serviceFormData.utilidad ?? 20} onChange={e=>setServiceFormData({...serviceFormData, utilidad: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block">% IVA</label>
                        <input type="number" min="0" value={serviceFormData.iva ?? 19} onChange={e=>setServiceFormData({...serviceFormData, iva: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                      </div>
                    </div>
                  </>
                ) : (
                  <>
                    <label className="text-xs text-slate-400 block">Precio referencial (por {unitLabel(serviceFormData.unit)})</label>
                    <input type="number" min="0" value={serviceFormData.precioRef ?? 0} onChange={e=>setServiceFormData({...serviceFormData, precioRef: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-2 rounded" />
                  </>
                )}

                <div className="flex justify-end space-x-3 pt-4 border-t border-slate-700">
                  <button type="button" onClick={()=>setServiceModal({open:false, service:null})} className="px-5 py-2 rounded text-slate-300 hover:bg-slate-800">Cancelar</button>
                  <button type="submit" className="px-5 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded">Guardar</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL DE PRODUCTO */}
          {modal.open && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <form onSubmit={saveProduct} className="bg-slate-900 p-6 rounded-xl border border-slate-600 max-w-md w-full space-y-4 max-h-[92vh] overflow-y-auto">
                <h3 className="font-bold text-xl text-green-400 mb-2">{modal.product ? 'Editar Producto' : 'Crear Producto'}</h3>

                <input required placeholder="Nombre" value={formData.name || ''} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-3 rounded" />
                <input required type="number" min="0" placeholder="Precio en pesos (referencial si es Construcción/Arriendo)" value={formData.price || ''} onChange={e=>setFormData({...formData, price: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-3 rounded" />

                <select value={formData.pillar || 'energia'} onChange={e=>{
                    const newPillar = e.target.value;
                    setFormData({...formData, pillar: newPillar, category: CATEGORIA_META[newPillar][0].id});
                  }} className="w-full bg-black border border-slate-600 text-white p-3 rounded">
                  <option value="energia">Energía</option>
                  <option value="construccion">Construcción</option>
                  <option value="arriendo">Arriendo</option>
                </select>

                <select value={formData.category || CATEGORIA_META[formData.pillar || 'energia'][0].id} onChange={e=>setFormData({...formData, category: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-3 rounded">
                  {CATEGORIA_META[formData.pillar || 'energia'].map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>

                <div className="relative">
                  <div className="flex justify-between items-center mb-1">
                    <label className="text-xs font-bold text-slate-400">Foto:</label>
                    <RefreshButton onClick={() => fetchFolderAssets(`productos-${formData.pillar || 'energia'}`, setPillarImageOptions, true)} />
                  </div>
                  <select value={formData.image || ''} onChange={e=>setFormData({...formData, image: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-3 rounded">
                    <option value="">-- Sin Imagen --</option>
                    {pillarImageOptions.map(path => <option key={path} value={path}>{path.split('/').pop()}</option>)}
                  </select>
                </div>

                <div className="flex items-center space-x-2 mt-2">
                  <input type="checkbox" id="visibleCheck" checked={formData.visible ?? true} onChange={e=>setFormData({...formData, visible: e.target.checked})} className="w-4 h-4 accent-green-500" />
                  <label htmlFor="visibleCheck" className="text-sm text-slate-300">Mostrar en catálogo público</label>
                </div>

                <textarea placeholder="Descripción breve" value={formData.description || ''} onChange={e=>setFormData({...formData, description: e.target.value})} className="w-full bg-black border border-slate-600 text-white p-3 rounded" rows="2"></textarea>

                <div className="flex justify-end space-x-3 pt-4 border-t border-slate-700">
                  <button type="button" onClick={()=>setModal({open:false})} className="px-5 py-2 rounded text-slate-300 hover:bg-slate-800">Cancelar</button>
                  <button type="submit" className="px-5 py-2 bg-green-600 hover:bg-green-500 text-white font-bold rounded">Guardar</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
