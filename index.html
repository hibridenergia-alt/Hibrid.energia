<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiBRID | Soluciones Energéticas</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #2ecc71; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        .btn { display: block; background: #2ecc71; color: #000; text-align: center; padding: 15px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; }
        h1, h2 { color: #2ecc71; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HiBRID</h1>
        <p>Soluciones Energéticas: Aire y Sol.</p>

        <div class="card">
            <h2>Calculadora de Consumo</h2>
            <input type="number" id="kwh" placeholder="Ingresa tu consumo mensual (kWh)">
            <button class="btn" onclick="calcular()">CALCULAR Y COTIZAR</button>
            <p id="resultado"></p>
        </div>

        <h2>Nuestros Kits</h2>
        <div class="card">
            <h3>Kit Residencial 5kW</h3>
            <p>$2.490.000 + IVA</p>
            <a href="https://wa.me/569XXXXXXXX?text=Hola, me interesa el Kit Residencial 5kW. Clasificación: MEDIO" class="btn">COTIZAR KIT</a>
        </div>
    </div>

    <script>
        function calcular() {
            let kwh = document.getElementById('kwh').value;
            let msg = "";
            let urgencia = kwh > 300 ? "URGENTE (Alto Consumo)" : (kwh > 150 ? "MEDIO" : "BAJO");
            let kit = kwh > 300 ? "Kit Autonomía Total" : "Kit Residencial";
            
            let link = `https://wa.me/56956139055?text=Hola, mi consumo es ${kwh} kWh. Recomendaron el ${kit}. Clasificación: ${urgencia}`;
            
            document.getElementById('resultado').innerHTML = `Recomendado: <strong>${kit}</strong><br><a href="${link}" class="btn" style="margin-top:10px">SOLICITAR PRESUPUESTO</a>`;
        }
    </script>
</body>
</html>
